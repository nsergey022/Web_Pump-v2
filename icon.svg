<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Тёмно-синий цифровой фон PWA -->
    <rect width="512" height="512" rx="100" fill="#0a0d14" />

<!-- Неоновый контур значка -->
<rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.3"/>

<!-- Внешнее кольцо насосного агрегата -->
<circle cx="256" cy="256" r="190" fill="#121824" stroke="#00f0ff" stroke-width="16"/>
<circle cx="256" cy="256" r="140" fill="#0a0d14" stroke="#1f293d" stroke-width="12"/>

<!-- Лопасти крыльчатки (Насос) -->
<g stroke="#00ff66" stroke-width="24" stroke-linecap="round">
    <line x1="256" y1="126" x2="256" y2="386"/>
    <line x1="126" y1="256" x2="386" y2="256"/>
    <line x1="164" y1="164" x2="348" y2="348"/>
    <line x1="164" y1="348" x2="348" y2="164"/>
</g>

<!-- Центральная ступица со свечением -->
<circle cx="256" cy="256" r="60" fill="#00ff66"/>
<circle cx="256" cy="256" r="30" fill="#ffffff"/>